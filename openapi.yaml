openapi: 3.0.4
info:
  title: Text Embeddings
  description: >-
    Text Embeddings turns a sentence, paragraph or short document into a
    384-dimension vector that captures its meaning, ready for semantic search,
    clustering, deduplication and recommendations. Send one text or a batch of
    up to 32, and add a compare text to get the cosine similarity of each one to
    it in the same call.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/textembeddings:
